server:
  port: 8080

spring:
  application:
    name: gateway

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173}

gateway:
  routes:
    - id: auth
      prefix: /api/auth
      uri: http://localhost:8101
    - id: users
      prefix: /api/users
      uri: http://localhost:8102
    - id: catalog
      prefix: /api/catalog
      uri: http://localhost:8103
    - id: products
      prefix: /api/products
      uri: http://localhost:8103
    - id: deals
      prefix: /api/deals
      uri: http://localhost:8103
    - id: search
      prefix: /api/search
      uri: http://localhost:8104
    - id: cart
      prefix: /api/cart
      uri: http://localhost:8105
    - id: orders
      prefix: /api/orders
      uri: http://localhost:8106
    - id: payments
      prefix: /api/payments
      uri: http://localhost:8107
    - id: inventory
      prefix: /api/inventory
      uri: http://localhost:8108
    - id: shipping
      prefix: /api/shipping
      uri: http://localhost:8109
    - id: reviews
      prefix: /api/reviews
      uri: http://localhost:8110
    - id: recommendations
      prefix: /api/recommendations
      uri: http://localhost:8111
    - id: notifications
      prefix: /api/notifications
      uri: http://localhost:8112
